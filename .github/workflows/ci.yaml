name: CloudOps Backend CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    name: Unit & Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Verify App Health
        run: |
          python -c "import main; print('FastAPI imported successfully')"

  security-scan:
    name: Container Build & DevSecOps Scan
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Local Image
        run: |
          docker build -t cloudops-backend:${{ github.sha }} .

      - name: Run Trivy Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'cloudops-backend:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  update-gitops:
    name: Automated GitOps Sync
    needs: security-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitOps Repo
        uses: actions/checkout@v4
        with:
          repository: 'Anandking-21/cloudops-gitops'
          token: ${{ secrets.GITOPS_TOKEN }}
          ref: 'main'

      - name: Update Deployment Image Tag
        run: |
          sed -i 's|image: cloudops-backend:.*|image: cloudops-backend:${{ github.sha }}|g' deployment.yaml

      - name: Commit & Push New Image to GitOps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deployment.yaml
          git diff --staged --quiet || (git commit -m "deploy: update image tag to ${{ github.sha }} [skip ci]" && git push origin main)
